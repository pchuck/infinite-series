[package]
name = "primes"
version = "1.1.0"
edition = "2021"
rust-version = "1.87"
description = "High-performance prime number generator"
authors = ["Prime Generator"]

[dependencies]
clap = { version = "4.4", features = ["derive"], optional = true }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
[features]
default = ["cli"]
cli = ["clap"]
tui = ["crossterm", "clap", "ratatui"]
bench-tools = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2.0"
predicates = "3.1"

[[bench]]
name = "prime_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "primes_cli"
path = "src/primes_cli.rs"
required-features = ["cli"]

[[bin]]
name = "bench_thresholds"
path = "scripts/benchmark_thresholds.rs"
required-features = ["bench-tools"]

[[bin]]
name = "primes_tui"
path = "src/primes_tui.rs"
required-features = ["tui"]
